# """
# Keeps bunoraa.com warm on Render's free tier.
# Uses a 10-minute cadence to absorb GitHub Actions scheduling latency and stay safely within Render's 15-minute idle timeout window.
# """
name: Keep Render Service Warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-render-service-warm
  cancel-in-progress: true

jobs:
  warmup:
    name: Warmup ${{ matrix.target_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: bunoraa-web
            target_url: https://bunoraa.com
          - target_name: bunoraa-api
            target_url: https://api.bunoraa.com/health/
    steps:
      - name: Send warmup request
        shell: bash
        env:
          TARGET_URL: ${{ matrix.target_url }}
          CONNECT_TIMEOUT_SECONDS: "30"
          REQUEST_TIMEOUT_SECONDS: "25"
          RETRY_COUNT: "2"
          RETRY_DELAY_SECONDS: "3"
          RETRY_MAX_TIME_SECONDS: "45"
          HARD_DEADLINE_SECONDS: "70"
        run: |
          set -Eeuo pipefail

          USER_AGENT="BunoraaWarmupAction/2.0 (+https://github.com/${{ github.repository }})"
          echo "Warmup target: ${TARGET_URL}"

          if ! HTTP_STATUS="$(
            timeout "${HARD_DEADLINE_SECONDS}s" \
              curl --head --location \
                --connect-timeout "${CONNECT_TIMEOUT_SECONDS}" \
                --max-time "${REQUEST_TIMEOUT_SECONDS}" \
                --retry "${RETRY_COUNT}" \
                --retry-delay "${RETRY_DELAY_SECONDS}" \
                --retry-max-time "${RETRY_MAX_TIME_SECONDS}" \
                --retry-all-errors \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out "%{http_code}" \
                --user-agent "${USER_AGENT}" \
                "${TARGET_URL}"
          )"; then
            echo "Warmup request failed or exceeded ${HARD_DEADLINE_SECONDS}s: ${TARGET_URL}" >&2
            exit 1
          fi
          echo "HTTP status code: ${HTTP_STATUS}"

          if [[ "${HTTP_STATUS}" -lt 200 || "${HTTP_STATUS}" -ge 400 ]]; then
            echo "Warmup returned non-success status for ${TARGET_URL}: ${HTTP_STATUS}" >&2
            exit 1
          fi

          {
            echo "### Warmup Result"
            echo "- Target: ${TARGET_URL}"
            echo "- HTTP status: ${HTTP_STATUS}"
          } >> "${GITHUB_STEP_SUMMARY}"
