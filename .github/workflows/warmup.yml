# """
# Keeps bunoraa.com warm on Render's free tier.
# Uses a 10-minute cadence to absorb GitHub Actions scheduling latency and stay safely within Render's 15-minute idle timeout window.
# """
name: Keep Render Service Warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  warmup:
    name: Warmup bunoraa.com
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send warmup requests
        continue-on-error: true
        shell: bash
        env:
          TARGET_URLS: |
            https://bunoraa.com
            https://api.bunoraa.com/
        run: |
          FAILED=0
          while IFS= read -r TARGET_URL; do
            [[ -z "${TARGET_URL}" ]] && continue
            HTTP_STATUS="$(curl -I -L \
              --connect-timeout 30 \
              --max-time 60 \
              --retry 5 \
              --retry-delay 10 \
              --retry-all-errors \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --user-agent "BunoraaWarmupAction/1.0 (+https://github.com/${{ github.repository }})" \
              "${TARGET_URL}")"
            echo "Warmup target: ${TARGET_URL}"
            echo "HTTP status code: ${HTTP_STATUS}"
            if [[ "${HTTP_STATUS}" -lt 200 || "${HTTP_STATUS}" -ge 400 ]]; then
              FAILED=1
            fi
          done <<< "${TARGET_URLS}"

          if [[ "${FAILED}" -ne 0 ]]; then
            exit 1
          fi
