version: 1

targets:
  - name: backend_local
    type: dotenv
    path: .env
  - name: frontend_local
    type: dotenv
    path: frontend/.env.local
  - name: render_backend
    type: render_yaml
    path: render.yaml
    service: Bunoraa
  - name: render_frontend
    type: render_yaml
    path: render.yaml
    service: Bunoraa-Frontend
  - name: render_worker
    type: render_yaml
    path: render-worker.yaml
    service: Bunoraa-Celery-Worker
  - name: warmup_cron
    type: render_yaml
    path: render.yaml
    service: Bunoraa-Warmup
  - name: backend_prod_external
    type: dotenv
    path: ${BUNORAA_BACKEND_ENV_PATH}
    optional: true

vars:
  # Frontend (public)
  - key: NEXT_PUBLIC_API_BASE_URL
    scope: frontend
    values:
      development: http://localhost:8000/api/v1
      production: https://api.bunoraa.com/api/v1
    targets: [backend_local, frontend_local, render_frontend]
  - key: NEXT_INTERNAL_API_BASE_URL
    scope: frontend
    values:
      development: http://localhost:8000/api/v1
      production: https://api.bunoraa.com/api/v1/
    targets: [backend_local, frontend_local, render_frontend]
  - key: NEXT_PUBLIC_MEDIA_BASE_URL
    scope: frontend
    values:
      development: https://media.bunoraa.com
      production: https://media.bunoraa.com
    targets: [backend_local, frontend_local, render_frontend]
  - key: NEXT_PUBLIC_SITE_URL
    scope: frontend
    values:
      development: http://localhost:3000
      production: https://bunoraa.com
    targets: [backend_local, frontend_local, render_frontend]
  - key: NEXT_PUBLIC_WS_BASE_URL
    scope: frontend
    values:
      development: ws://localhost:8000/ws
      production: wss://api.bunoraa.com
    targets: [backend_local, frontend_local, render_frontend]
  - key: NEXT_PUBLIC_WS_ENABLED
    scope: frontend
    values:
      development: "true"
      production: "true"
    targets: [backend_local, frontend_local, render_frontend]
  - key: NEXT_PUBLIC_DEFAULT_LANGUAGE
    scope: frontend
    values:
      development: "en"
      production: "en"
    targets: [backend_local, frontend_local, render_frontend]
  - key: NEXT_PUBLIC_LOCALES
    scope: frontend
    values:
      development: "en,bn,hi"
      production: "en,bn,hi"
    targets: [backend_local, frontend_local, render_frontend]
  - key: NEXT_DISABLE_PRERENDER
    scope: frontend
    values:
      development: "true"
      production: "true"
    targets: [backend_local, frontend_local, render_frontend]
  - key: NEXT_DISABLE_BUILD_PRERENDER
    scope: frontend
    values:
      development: "false"
      production: "true"
    targets: [backend_local, frontend_local, render_frontend]
  - key: NEXT_IMAGE_UNOPTIMIZED
    scope: frontend
    values:
      development: "true"
      production: "true"
    targets: [backend_local, frontend_local, render_frontend]
  - key: NEXT_API_PROXY_TARGET
    scope: frontend
    values:
      development: http://localhost:8000
      production: https://api.bunoraa.com
    targets: [backend_local, frontend_local, render_frontend]
  - key: NEXT_PUBLIC_API_USE_PROXY
    scope: frontend
    values:
      development: "false"
      production: "false"
