# Netlify configuration for Bunoraa frontend

[build]
  # Build directory relative to the root of your repository
  base = "frontend"
  # Build command
  command = "npm run build"
  # Directory that contains the built site files to be deployed
  publish = ".next"

# Configure secrets scanning to ignore specific environment variables
# These are intentionally public or configured via Netlify environment variables
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API proxy configuration for local development
[dev]
  command = "npm run dev"
  port = 3000
  publish = ".next"

# Headers for security and optimization
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
