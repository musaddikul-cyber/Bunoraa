services:
  - type: web
    name: Bunoraa
    runtime: python
    buildCommand: "./build.sh"
    startCommand: >-
      gunicorn core.asgi:application -k uvicorn.workers.UvicornWorker --config gunicorn_conf.py
    healthCheckPath: "/health/"
    envVars:
      - key: ENVIRONMENT
        value: "production"
      - key: DJANGO_SETTINGS_MODULE
        value: "core.settings.production"
      - key: DATABASE_URL
        sync: false
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: DB_STATEMENT_TIMEOUT_MS
        value: "30000"
      - key: DB_IDLE_TX_TIMEOUT_MS
        value: "60000"
      - key: DB_IDLE_SESSION_TIMEOUT_MS
        value: "60000"
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: bunoraa.com,www.bunoraa.com,api.bunoraa.com,.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: "https://bunoraa.com,https://www.bunoraa.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://bunoraa.com,https://www.bunoraa.com"
      - key: NEXT_FRONTEND_ORIGIN
        value: "https://bunoraa.com"
      - key: ML_ENABLED
        value: "false"
      - key: ML_API_ENABLED
        value: "false"
      - key: ML_CELERY_BEAT_ENABLED
        value: "false"
      - key: ML_CHAT_ASSISTANT
        value: "false"
      - key: CHAT_AI_LOCAL_MODEL_ENABLED
        value: "false"
      - key: CHAT_AI_DEFAULT_MODEL
        value: "Qwen/Qwen2.5-1.5B-Instruct"
      - key: CHAT_AI_ALLOWED_MODELS
        value: "Qwen/*,microsoft/Phi-3.5-mini-instruct,mistralai/Ministral-8B-Instruct-2410,meta-llama/Llama-3.2-3B-Instruct"
      - key: CHAT_AI_MODEL_FALLBACKS
        value: "Qwen/Qwen2.5-0.5B-Instruct,microsoft/Phi-3.5-mini-instruct"
      - key: CHAT_AI_GENERATION_MAX_TIME_SECONDS
        value: "12"
      - key: PRERENDER_ENABLED
        value: "false"
      - key: LIBRETRANSLATE_URL
        value: "http://bunoraa-libretranslate:5000"
      - key: LIBRETRANSLATE_API_KEY
        value: ""
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: REDIS_MAX_CONNECTIONS
        value: "50"
      - key: REDIS_SOCKET_CONNECT_TIMEOUT
        value: "10"
      - key: REDIS_SOCKET_TIMEOUT
        value: "10"
      - key: REDIS_SOCKET_KEEPALIVE
        value: "true"
      - key: REDIS_SOCKET_KEEPALIVE_IDLE
        value: "30"
      - key: REDIS_SOCKET_KEEPALIVE_INTERVAL
        value: "10"
      - key: REDIS_SOCKET_KEEPALIVE_COUNT
        value: "3"
      - key: REDIS_HEALTH_CHECK_INTERVAL
        value: "15"
      - key: REDIS_RETRY_ON_TIMEOUT
        value: "true"
      - key: REDIS_USE_BLOCKING_POOL
        value: "true"
      - key: REDIS_POOL_BLOCKING_TIMEOUT
        value: "5"
      - key: SESSION_ENGINE
        value: "django.contrib.sessions.backends.cache"
      - key: WS_SESSION_AUTH_ENABLED
        value: "false"
      - key: CHANNEL_LAYERS_REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP
        value: "true"
      - key: CELERY_BROKER_CONNECTION_MAX_RETRIES
        value: "100"
      - key: CELERY_TASK_TIME_LIMIT
        value: "600"
      - key: CELERY_TASK_SOFT_TIME_LIMIT
        value: "540"
      - key: CELERY_RESULT_EXPIRES
        value: "3600"
      - key: CELERY_WORKER_PREFETCH_MULTIPLIER
        value: "1"
      - key: CELERY_WORKER_MAX_TASKS_PER_CHILD
        value: "500"
      - key: CELERY_TASK_ACKS_LATE
        value: "true"
      - key: CELERY_TASK_REJECT_ON_WORKER_LOST
        value: "true"
      - key: CELERY_TASK_ACKS_ON_FAILURE_OR_TIMEOUT
        value: "true"
      - key: CELERY_TASK_DEFAULT_RETRY_DELAY
        value: "60"
      - key: CELERY_TASK_MAX_RETRIES
        value: "3"
      - key: ML_REDIS_URL
        sync: false
      - key: USE_S3
        value: "True"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        value: "bunoraa"
      - key: AWS_S3_REGION_NAME
        value: "us-east-1"
      - key: AWS_S3_ENDPOINT_URL
        value: "https://558bc0d014e2ae8268244260bf05b597.r2.cloudflarestorage.com"
      - key: AWS_S3_CUSTOM_DOMAIN
        value: "media.bunoraa.com"
      - key: AWS_DEFAULT_ACL
        value: "None"
      - key: AWS_S3_CACHE_CONTROL
        value: "max-age=86400"
      - key: MEDIA_URL
        value: "https://media.bunoraa.com/"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "musaddikul.amin123@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_SERVICE_TRANSPORT
        value: "smtp"
      - key: EMAIL_SERVICE_HTTP_FALLBACK_ON_SMTP_FAILURE
        value: "false"
      - key: EMAIL_QUEUE_SYNC_FALLBACK
        value: "true"
      - key: EMAIL_QUEUE_WORKER_PING_TIMEOUT
        value: "1.0"
      - key: EMAIL_QUEUE_WORKER_PING_CACHE_TTL
        value: "30"
      - key: DEFAULT_FROM_EMAIL
        value: "noreply@bunoraa.com"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: "https://bunoraa.com/oauth/complete/google-oauth2/"
      - key: SOCIAL_AUTH_LOGIN_REDIRECT_URL
        value: "https://bunoraa.com/account/oauth/callback/"
      - key: SOCIAL_AUTH_REDIRECT_IS_HTTPS
        value: "True"
      - key: SSLCOMMERZ_STORE_ID
        sync: false
      - key: SSLCOMMERZ_STORE_PASSWORD
        sync: false
      - key: SSLCOMMERZ_IS_SANDBOX
        value: "True"
      - key: BKASH_APP_KEY
        sync: false
      - key: BKASH_APP_SECRET
        sync: false
      - key: BKASH_USERNAME
        sync: false
      - key: BKASH_PASSWORD
        sync: false
      - key: BKASH_IS_SANDBOX
        value: "True"
      - key: NAGAD_MERCHANT_ID
        sync: false
      - key: NAGAD_PUBLIC_KEY
        sync: false
      - key: NAGAD_PRIVATE_KEY
        sync: false
      - key: NAGAD_IS_SANDBOX
        value: "True"
      - key: STEADFAST_API_KEY
        sync: false
      - key: STEADFAST_SECRET_KEY
        sync: false
      - key: STEADFAST_API_ENDPOINT
        value: ""
      - key: STEADFAST_API_SANDBOX
        value: "False"
      - key: SENTRY_DSN
        sync: false
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_THREADS
        value: "1"
      - key: GUNICORN_MAX_REQUESTS
        value: "200"
      - key: GUNICORN_MAX_REQUESTS_JITTER
        value: "50"
      - key: GUNICORN_TIMEOUT
        value: "45"
      - key: GUNICORN_GRACEFUL_TIMEOUT
        value: "20"
      - key: GUNICORN_KEEPALIVE
        value: "5"
      - key: GUNICORN_LOG_LEVEL
        value: "warning"
      - key: RUN_PRODUCTION_OPTIMIZERS
        value: "false"
      - key: RUN_SEO_SCHEDULE_SETUP
        value: "false"
    plan: free

  - type: worker
    name: Bunoraa-Celery-Worker
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "bash scripts/start_celery_worker.sh"
    envVars:
      - key: ENVIRONMENT
        value: "production"
      - key: DJANGO_SETTINGS_MODULE
        value: "core.settings.production"
      - key: DEBUG
        value: "false"
      - key: PROCESS_TYPE
        value: "worker"
      - key: ML_ENABLED
        value: "false"
      - key: ML_API_ENABLED
        value: "false"
      - key: ML_CELERY_BEAT_ENABLED
        value: "false"
      - key: ML_CHAT_ASSISTANT
        value: "false"
      - key: CHAT_AI_LOCAL_MODEL_ENABLED
        value: "false"
      - key: PRERENDER_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: USE_S3
        value: "True"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        value: "bunoraa"
      - key: AWS_S3_REGION_NAME
        value: "us-east-1"
      - key: AWS_S3_ENDPOINT_URL
        value: "https://558bc0d014e2ae8268244260bf05b597.r2.cloudflarestorage.com"
      - key: AWS_S3_CUSTOM_DOMAIN
        value: "media.bunoraa.com"
      - key: AWS_DEFAULT_ACL
        value: "None"
      - key: AWS_S3_CACHE_CONTROL
        value: "max-age=86400"
      - key: MEDIA_URL
        value: "https://media.bunoraa.com/"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "musaddikul.amin123@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        sync: false
    plan: starter

  - type: worker
    name: Bunoraa-Celery-Beat
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "bash scripts/start_celery_beat.sh"
    envVars:
      - key: ENVIRONMENT
        value: "production"
      - key: DJANGO_SETTINGS_MODULE
        value: "core.settings.production"
      - key: DEBUG
        value: "false"
      - key: PROCESS_TYPE
        value: "scheduler"
      - key: BACKUP_ENABLED
        value: "true"
      - key: ML_ENABLED
        value: "false"
      - key: ML_API_ENABLED
        value: "false"
      - key: ML_CELERY_BEAT_ENABLED
        value: "false"
      - key: ML_CHAT_ASSISTANT
        value: "false"
      - key: CHAT_AI_LOCAL_MODEL_ENABLED
        value: "false"
      - key: PRERENDER_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
    plan: starter

  - type: web
    name: Bunoraa-Frontend
    runtime: node
    rootDir: frontend
    buildCommand: "npm ci --no-audit --prefer-offline && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_OPTIONS
        value: "--max-old-space-size=256"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_DISABLE_PRERENDER
        value: "true"
      - key: NEXT_DISABLE_BUILD_PRERENDER
        value: "true"
      - key: NEXT_IMAGE_UNOPTIMIZED
        value: "true"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: "https://api.bunoraa.com/api/v1"
      - key: NEXT_INTERNAL_API_BASE_URL
        value: "https://api.bunoraa.com/api/v1/"
      - key: NEXT_PUBLIC_SITE_URL
        value: "https://bunoraa.com"
      - key: NEXT_PUBLIC_MEDIA_BASE_URL
        value: "https://media.bunoraa.com"
      - key: NEXT_API_PROXY_TARGET
        value: "https://api.bunoraa.com"
      - key: NEXT_PUBLIC_WS_BASE_URL
        value: "wss://api.bunoraa.com"
      - key: NEXT_PUBLIC_WS_ENABLED
        value: "true"
      - key: NEXT_PUBLIC_DEFAULT_LANGUAGE
        value: "en"
      - key: NEXT_PUBLIC_LOCALES
        value: "en,bn,hi"
    plan: free

  - type: web
    name: Bunoraa-LibreTranslate
    runtime: docker
    image:
      url: libretranslate/libretranslate:latest
    envVars:
      - key: PORT
        value: "5000"
      - key: LT_DISABLE_WEB_UI
        value: "true"
      - key: LT_LOAD_ONLY
        value: ""
    plan: free

  - type: cron
    name: Bunoraa-Warmup
    runtime: python
    schedule: "*/5 * * * *"
    buildCommand: "echo warmup"
    startCommand: "python scripts/warmup.py"
    envVars:
      - key: WARMUP_URLS
        value: "https://bunoraa-django.onrender.com/health/,https://bunoraa-pl26.onrender.com/,https://api.bunoraa.com/"
      - key: WARMUP_TIMEOUT
        value: "45"
      - key: WARMUP_RETRIES
        value: "2"
      - key: WARMUP_RETRY_DELAY_MS
        value: "1200"
    plan: free
