<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Bunoraa</title>
    <style>
        :root {
            --primary: #0f766e;
            --primary-light: #14b8a6;
            --text: #1f2937;
            --text-light: #6b7280;
            --bg: #f9fafb;
            --white: #ffffff;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
            opacity: 0.2;
        }
        
        .error-title {
            font-size: 2rem;
            font-weight: 600;
            margin: 1rem 0;
            color: var(--text);
        }
        
        .error-message {
            font-size: 1.125rem;
            color: var(--text-light);
            margin-bottom: 2rem;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: var(--white);
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(15, 118, 110, 0.3);
        }
        
        .search-box {
            margin-top: 2.5rem;
            padding: 1.5rem;
            background: var(--white);
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        .search-title {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-light);
            margin-bottom: 1rem;
        }
        
        .search-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
        }
        
        .search-link {
            padding: 0.5rem 1rem;
            background: var(--bg);
            color: var(--text);
            text-decoration: none;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            transition: background 0.2s;
        }
        
        .search-link:hover {
            background: var(--primary);
            color: var(--white);
        }
        
        @media (max-width: 480px) {
            .error-code {
                font-size: 5rem;
            }
            .error-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <main class="container" role="main" aria-label="Page not found">
        <div class="error-code" aria-hidden="true">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">
            Oops! The page you're looking for seems to have wandered off. 
            It might have been moved or deleted.
        </p>
        <a href="/" class="btn" aria-label="Return to homepage">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            Go Home
        </a>
        
        <div class="search-box">
            <p class="search-title">Popular Destinations</p>
            <nav class="search-links" aria-label="Popular pages">
                <a href="/products/" class="search-link">Shop</a>
                <a href="/categories/" class="search-link">Categories</a>
                <a href="/collections/" class="search-link">Collections</a>
                <a href="/bundles/" class="search-link">Bundles</a>
                <a href="/artisans/" class="search-link">Artisans</a>
            </nav>
        </div>
    </main>
</body>
</html>
